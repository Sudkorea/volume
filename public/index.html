<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self'; connect-src 'self' https://snb-macbook-pro.tail643f01.ts.net; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f3f4f1">
    <meta name="volume-api-base" content="https://snb-macbook-pro.tail643f01.ts.net">
    <title>볼륨</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=20260820-share1">
  </head>
  <body>
    <section class="setup" id="entry" aria-labelledby="entry-title">
      <div class="setup__panel">
        <div class="app-icon" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1 id="entry-title">볼륨</h1>
        <p class="setup__description">이 페이지에서 재생하는 소리의 크기를 조절합니다.</p>

        <label class="boost-option" id="boost-option">
          <input id="boost-choice" type="checkbox">
          <span class="switch" aria-hidden="true"><span></span></span>
          <span class="boost-option__copy">
            <strong>볼륨 조절 부스트</strong>
            <small>볼륨이 더 잘 커집니다.</small>
          </span>
        </label>

        <button class="button button--primary" id="delegate-button" type="button">계속</button>
      </div>
    </section>

    <main class="app" id="dashboard" hidden>
      <header class="header">
        <div>
          <h1>볼륨</h1>
          <p>현재 브라우저의 출력 음량입니다.</p>
        </div>
        <div class="status" id="connection-pill">
          <span aria-hidden="true"></span>
          <span id="connection-label">연결 중</span>
        </div>
      </header>

      <section class="content-grid">
        <article class="card volume-card">
          <div class="card__header">
            <div>
              <p class="label">출력 음량</p>
              <h2><span id="volume-number">—</span><small>%</small></h2>
            </div>
            <button class="button button--text" id="reselect-button" type="button">설정 변경</button>
          </div>

          <div
            class="volume-track"
            id="volume-dial"
            role="progressbar"
            aria-label="현재 출력 음량"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ><span></span></div>
          <p class="automatic-note">게시글 조회수에 따라 자동으로 바뀝니다.</p>

          <div class="preview">
            <div class="preview__header">
              <div>
                <strong>재생</strong>
                <span id="audio-caption">영상 준비 중</span>
              </div>
              <button class="button button--secondary" id="audio-toggle" type="button" aria-pressed="false">재생</button>
            </div>
            <div class="youtube-frame" id="youtube-frame">
              <div id="youtube-player"></div>
            </div>
          </div>
        </article>

        <aside class="card source-card" id="source-card">
          <div class="source-card__title">
            <p class="label">볼륨 기준</p>
            <span class="boost-badge" id="mode-badge">부스트</span>
          </div>

          <dl class="details">
            <div>
              <dt>게시글</dt>
              <dd><a id="post-link" href="#" target="_blank" rel="noreferrer"><span id="post-title">확인 중</span></a></dd>
            </div>
            <div>
              <dt>조회수</dt>
              <dd id="view-count">—</dd>
            </div>
          </dl>

          <div class="share-action">
            <span>더 빨리 바꾸려면</span>
            <button class="button button--secondary" id="share-button" type="button" disabled>공유</button>
          </div>
        </aside>
      </section>

      <aside class="notice" id="alert-banner" hidden role="alert">
        <div>
          <strong id="alert-title">게시글을 확인할 수 없습니다.</strong>
          <p id="alert-copy">마지막으로 확인한 음량을 유지합니다.</p>
        </div>
      </aside>

      <footer>
        <span>볼륨은 게시글 조회수로 정해집니다.</span>
        <span id="discord-status" hidden></span>
      </footer>
    </main>

    <script type="module" src="./app.js?v=20260820-share1"></script>
  </body>
</html>
